# ui.tooltip: Tooltips for UI elements. THESE MUST BE WRAPPED BY HAND!
############################################################ ← approx wrap
ui.tooltip.4gb=\
Vanilla Spore only asks for 2GB of process memory. On modern\n\
machines, this leads Spore to run out of memory and become un-\n\
stable. I STRONGLY recommend you leave this option checked.
ui.tooltip.disable_validation=\
Spore normally performs some extra validation before allow-\n\
ing you to save a Creation. If you get an error dialog when\n\
you try to exit an Editor, enable this option.
ui.tooltip.target_framerate=\
Spore will never render more frames than this per second.\n\
Set this to your monitor\u2019s refresh rate for best results.
ui.tooltip.texture_size=\
How large of a texture Spore should render for Creations.\n\
Increasing this will make textures on surfaces look nicer.\n\
The game originally only used 512x512, which is quite mud-\n\
dy by modern standards.
ui.tooltip.dangerous_size=\
Spore was not built to handle textures this large. Stability\n\
issues may result.
ui.tooltip.restore=\
Restores each important file to the state they were in when\n\
you first ran SporeUplift. This will revert all changes Spore-\n\
Uplift made. You can always run SporeUplift again.\n\
\n\
Side note: Pressing this button makes SporeUplift sad.
ui.tooltip.save_and_exit=\
Saves all changes, making Spore ready to run with the sel-\n\
ected settings.
############################################################ ← approx wrap

