# ui.tooltip: Tooltips for UI elements. THESE MUST BE WRAPPED BY HAND!
############################################################ ← approx wrap
ui.tooltip.4gb=\
Vanila Spore petas nur 2GB da procezmemoro. Ĉe modernaj kom-\n\
putiloj, tio kaŭzas ke Spore elĉerpas memoron kaj fariĝas mal-\n\
stabila. Mi FORTE rekomendas ke vi lasu ĉi tiun opcion markita.
ui.tooltip.disable_validation=\
Spore kutime plenumas iom da ekstra validigo antaŭ ol permesi\n\
al vi konservi Creation. Se vi ricevas erardialogon kiam vi\n\
provas eliri redaktilon, ebligu ĉi tiun opcion.
ui.tooltip.target_framerate=\
Spore neniam bildigos pli da bildoj ol ĉi tio po sekundo.\n\
Agordu ĉi tion al la refreŝiga ofteco de via ekrano por plej\n\
bonaj rezultoj.
ui.tooltip.texture_size=\
Kiom grandan teksturon Spore devus bildigi por Creations. Pli-\n\
grandigi ĉi tion igos teksturojn sur surfacoj aspekti pli belaj.\n\
La ludo origine uzis nur 512x512, kio estas sufiĉe kotkovrita\n\
laŭ modernaj normoj.
ui.tooltip.dangerous_size=\
Spore ne estis konstruita por pritrakti teksturojn tiel gran-\n\
dajn. Malstabileco povas rezulti.
ui.tooltip.restore=\
Restaŭras ĉiun gravan dosieron al la stato en kiu ĝi estis kiam\n\
vi unue funkciigis SporeUplift. Ĉi tio nuligos ĉiujn ŝanĝojn\n\
faritajn de SporeUplift. Vi ĉiam povas refunkciigi SporeUplift.

Flanka noto: Premante ĉi tiun butonon, SporeUplift estas malĝoja.
ui.tooltip.save_and_exit=\
Konservas ĉiujn ŝanĝojn, pretigante Spore-on por funkcii kun\n\
la elektitaj aliigojn.
