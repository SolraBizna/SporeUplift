# ui.tooltip: Tooltips for UI elements. THESE MUST BE WRAPPED BY HAND!
############################################################ <-- approx wrap
ui.tooltip.4gb=\
Vanila Spore petas nur 2GB da procezmemoro. \u0108e modernaj kom-\n\
putiloj, tio ka\u016Dzas ke Spore el\u0109erpas memoron kaj fari\u011Das mal-\n\
stabila. Mi FORTE rekomendas ke vi lasu \u0109i tiun opcion markita.
ui.tooltip.disable_validation=\
Spore kutime plenumas iom da ekstra validigo anta\u016D ol permesi\n\
al vi konservi Creation. Se vi ricevas erardialogon kiam vi\n\
provas eliri redaktilon, ebligu \u0109i tiun opcion.
ui.tooltip.target_framerate=\
Spore neniam bildigos pli da bildoj ol \u0109i tio po sekundo.\n\
Agordu \u0109i tion al la refre\u015Diga ofteco de via ekrano por plej\n\
bonaj rezultoj.
ui.tooltip.texture_size=\
Kiom grandan teksturon Spore devus bildigi por Creations. Pli-\n\
grandigi \u0109i tion igos teksturojn sur surfacoj aspekti pli belaj.\n\
La ludo origine uzis nur 512x512, kio estas sufi\u0109e kotkovrita\n\
la\u016D modernaj normoj.
ui.tooltip.dangerous_size=\
Spore ne estis konstruita por pritrakti teksturojn tiel gran-\n\
dajn. Malstabileco povas rezulti.
ui.tooltip.restore=\
Resta\u016Dras \u0109iun gravan dosieron al la stato en kiu \u011Di estis kiam\n\
vi unue funkciigis SporeUplift. \u0108i tio nuligos \u0109iujn \u015Dan\u011Dojn\n\
faritajn de SporeUplift. Vi \u0109iam povas refunkciigi SporeUplift.

Flanka noto: Premante \u0109i tiun butonon, SporeUplift estas mal\u011Doja.
ui.tooltip.save_and_exit=\
Konservas \u0109iujn \u015Dan\u011Dojn, pretigante Spore-on por funkcii kun\n\
la elektitaj aliigojn.
